# Pubblicazione su Netlify: a ogni modifica genera le pagine dai file in dati/
[build]
  publish = "."
  command = "python3 strumenti/genera_pagine.py"

# Finché il sito è in prova: chiede a Google di non indicizzarlo. Togliere al lancio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
